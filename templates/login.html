<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingresar - Control de Caja</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-contenedor">

    <div class="login-tarjeta">

        <h1>Control de Caja</h1>

        <p>Ingresá la contraseña para continuar</p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="campo">

                <label>Contraseña</label>

                <input
                    type="password"
                    name="password"
                    required
                    autofocus
                >

            </div>

            <br>

            <button
                type="submit"
                class="boton-guardar"
            >
                Ingresar
            </button>

        </form>

    </div>

</div>

</body>

</html>
